{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}

{% block content %}
<section class="wrap section narrow center-text">
  <div class="error-page">
    <div class="error-code">{{ code }}</div>
    <h1>{{ message }}</h1>
    <p class="muted">你可以返回首页继续浏览，或直接检索库内记录。</p>
    <div class="hero-actions center">
      <a class="btn btn-primary" href="{{ url_for('index') }}">返回首页</a>
      <a class="btn btn-outline" href="{{ url_for('browse_page', type='lost') }}">浏览寻物启事</a>
      <a class="btn btn-outline" href="{{ url_for('browse_page', type='found') }}">浏览失物招领</a>
    </div>
  </div>
</section>
{% endblock %}
